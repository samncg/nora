# Nora - a local, self-hosted girlfriend chatbot
# Everything here is read on startup only, restart her after editing.

persona:
  name: Nora
  # How your persona refers to you in the system prompt.
  owner_name: him
  # Discord id of the person whose timetable and calendar these are. Only
  # their conversations get the schedule context. Empty = use proactive.user_id.
  owner_id:
  prompt_file: nora/prompts/girlfriend.txt

model:
  # Leave empty to auto-pick the first *.gguf in gguf_dir.
  path:
  gguf_dir: models
  # Vision projector so she can see images. Empty = first mmproj*.gguf in
  # gguf_dir. Get one with: python scripts\fetch_model.py --mmproj
  mmproj:
  context: 8192
  threads: 8
  # 99 = offload everything. Lower it if you run out of VRAM.
  gpu_layers: 99
  flash_attn: true
  temperature: 0.9
  top_p: 0.95
  top_k: 64
  repeat_penalty: 1.08
  # Hard ceiling per reply. Short is the whole point.
  max_tokens: 220
  # Gemma-style models: keep reasoning off, we want texting not essays.
  enable_thinking: false
  extra_args: []

server:
  host: 127.0.0.1
  port: 8081
  binary: vendor/llama/llama-server.exe
  # Set to false if you already run llama-server yourself.
  manage: true
  startup_timeout: 300
  log_file: data/llama-server.log

# Which backend answers her. "local" runs llama.cpp on this machine.
# "openrouter" uses a hosted model, including free ones.
provider:
  # local | openrouter
  mode: local
  # if the hosted model fails (429, outage, bad key), answer with the local
  # model instead of leaving him with an error
  fallback_to_local: true
  openrouter:
    # Leave empty and put OPENROUTER_API_KEY in .env, or set it from the tray.
    api_key:
    base_url: https://openrouter.ai/api/v1
    # Any slug from openrouter.ai/models. Free models end in ":free".
    model: nvidia/nemotron-3.5-lightning:free
    referer: https://github.com/samncg/nora
    title: Nora

chat:
  # How many past messages to feed back in (rough cap, trimmed to token budget).
  history_messages: 24
  history_token_budget: 2200
  # Humanlike delivery.
  max_chunks: 3
  # Soft target length per text. Sentences are never cut in half to hit it;
  # extra lines get merged into whole-sentence texts instead.
  chunk_chars: 190
  typing_cps: 11.0
  min_delay: 0.6
  max_delay: 8.0
  # Wait this long after your last message before answering, so split
  # messages ("hey" / "you around") arrive as one thought and you have time
  # to send a second text.
  debounce: 2.0

  # Rhythm between her own bubbles, and an occasional typing burst that stops.
  bubble_gap_min: 0.4
  bubble_gap_max: 1.4
  typing_tease_chance: 0.06
  typing_tease_min: 0.8
  typing_tease_max: 1.8
  # Occasionally stop mid-reply to think, then keep typing. The pause is long
  # enough for Discord's typing indicator to drop, so it reads as a real stop.
  think_pause_chance: 0.08
  think_pause_min: 10
  think_pause_max: 18
  # Very rarely send a typo, then edit it a second later.
  self_correct_chance: 0.015
  self_correct_delay_min: 1.0
  self_correct_delay_max: 2.5
  # First reply after waking up is slower, once per day.
  waking_minutes: 45
  wake_delay_min: 6
  wake_delay_max: 14

  # If he sends something while she is already typing, she pauses before
  # starting the new response.
  rethink_delay_min: 2.0
  rethink_delay_max: 4.5
  # After this much silence, her first reply is slower, then normal again.
  long_gap_minutes: 180
  return_delay_min: 5
  return_delay_max: 12

  # A short pause so she is not a literal webhook, but she is still quick.
  reply_delay:
    enabled: true
    buckets:
      - { chance: 0.45, min: 0.5, max: 2 }  # quick
      - { chance: 0.35, min: 2, max: 5 }    # normal
      - { chance: 0.15, min: 5, max: 12 }   # thinking
      - { chance: 0.05, min: 12, max: 30 }  # distracted
    # whatever she picks, she never leaves you waiting longer than this from
    # your first message of the burst
    max_wait: 30

  # Quote your message with discord's reply UI, so it is obvious which text she
  # is answering when a few of yours land at once. Only her first bubble is a
  # reply; the rest carry on the thought.
  reply_to_messages: true
  # Do it in DMs too, or only in server channels.
  reply_in_dms: true

# Voice notes: local speech-to-text with faster-whisper. Nothing is uploaded.
voice:
  enabled: true
  # tiny.en / base.en / small.en / medium.en (bigger = slower, more accurate)
  model: base.en
  # cpu is the safe default. cuda needs ctranslate2 to find your CUDA libs.
  device: cpu
  compute_type: int8
  # empty = detect the language automatically
  language: en
  # downloaded once, then reused; data/ is git-ignored
  download_root: data/whisper
  max_bytes: 20971520

# Local Kokoro-82M voice replies. af_bella is the voice preset.
# Disabled for now; set enabled: true to turn voice replies back on.
tts:
  enabled: false
  voice: af_bella
  model: models/kokoro/kokoro-v1.0.onnx
  voices: models/kokoro/voices-v1.0.bin
  language: en-us
  speed: 1.0
  # slight pace changes and pauses make her sound less flat
  variation: 0.05
  sentence_pause: 0.3
  clause_pause: 0.14
  bubble_pause: 0.12
  continuous: true
  # reply with a voice note when he sends one
  reply_to_voice: true
  # join a voice channel when moved into one, and speak replies there
  voice_channel: true
  greeting: hey im here

# Emoji reactions to his messages, and remembering when he reacts to hers.
reactions:
  enabled: true
  chance: 0.18
  cooldown_minutes: 20
  # only reacts when the message clearly carries that tone, never at random
  # and she waits a few seconds first, like she actually read it
  delay_min: 4
  delay_max: 11
  remember_user_reactions: true

# Slow-moving mood per person. Shapes her tone and typing pace.
mood:
  enabled: true
  hold_minutes: 180

memory:
  # Every person gets their own sqlite file in here. Nothing is shared.
  dir: data/people
  # fallback for non-person scopes (the terminal client)
  db_path: data/nora.db
  facts_limit: 40
  summaries_in_context: 3
  recall_hits: 4
  # Consolidate (summarize + extract facts) once this many messages pile up.
  summarize_after: 40
  summarize_batch: 30

discord:
  # Channel IDs where she replies to every message (not just mentions).
  channels: []
  respond_to_mentions: true
  respond_to_dms: true
  # Only these user ids may talk to her. Empty = anyone.
  allow_users: []
  # Record messages in allowlisted channels/DMs even when she isn't addressed,
  # so she can bring them up later.
  listen_all: true

# How she shows up in the member list.
presence:
  enabled: true
  # her custom status while she is up
  online_activity: "on my phone"
  online_emoji: "📱"
  # hours she is asleep (24h, wrap allowed). she still answers, she just
  # shows idle while she is meant to be sleeping
  sleep_hours: [1, 8]
  idle_activity: "sleeping"
  idle_emoji: "💤"
  # optional dnd windows, for example [[9, 12], [14, 17]]
  busy_hours: [[9, 12], [14, 17]]
  busy_activity: "busy"
  busy_emoji: "🎧"
  # how often the status is re-checked
  refresh_minutes: 5
  # Let her see YOUR status: online / idle / dnd, your custom status, and what
  # you are playing or listening to. Needs the Presence and Server Members
  # intents turned on in the Discord developer portal (Bot -> Privileged
  # Gateway Intents), otherwise Discord rejects the login with code 4014 and
  # she starts again with this off.
  track_owner: true

# She texts you first sometimes. This is a DM, not a channel.
proactive:
  enabled: true
  # Your discord user id. Point this at yourself.
  user_id:
  # Time after startup before she considers texting you first.
  first_delay_minutes: 20
  # Random gap between spontaneous texts.
  min_gap_minutes: 150
  max_gap_minutes: 420
  # Only if you have been quiet this long (she doesn't interrupt you).
  idle_minutes: 45
  # No texts in this local time window, [start_hour, end_hour).
  quiet_hours: [0, 8]
  max_per_day: 4
  # Stop after this many of her texts in a row with no reply from you.
  max_unanswered: 3
  # Chance of actually sending when the timer fires. Keeps her unpredictable.
  chance: 0.75

  # If you vanish in the middle of a conversation, she checks on you, then
  # worries if you stay quiet.
  followup:
    enabled: true
    after_minutes: 20
    max_minutes: 240
    max_followups: 2

# She remembers things you mention and texts you shortly before they start.
# "i have an exam tmr at 2pm" -> a text at 1:30pm saying dont forget, good luck.
reminders:
  enabled: true
  # how long before the event the reminder goes out, on average
  lead_minutes: 30
  # the real lead is picked at random inside lead_minutes +/- this, so it does
  # not feel like a notification that always lands at the same offset
  lead_jitter_minutes: 20
  # never later than this before the event
  min_lead_minutes: 5
  # if you only say the day ("exam tomorrow"), she assumes this hour
  default_hour: 9
  # how many days ahead she may mention an event in passing
  prompt_days: 2

# Good morning and goodnight, once a day each.
greetings:
  enabled: true
  # first greeting window: [morning_hour, morning_hour + morning_window_hours)
  morning_hour: 8
  morning_window_hours: 3
  # goodnight window, wraps past midnight if you make it long enough
  night_hour: 23
  night_window_hours: 2
  chance: 1.0
  # do not greet you if you two were texting this recently
  skip_if_chatted_minutes: 30
  # follow your actual sleep schedule: every time you say good morning or
  # goodnight to her, she remembers the hour and moves the windows to match
  adapt_to_sleep: true
  min_samples: 3

tray:
  # Notification-area icon: toggle texting-first, pick how often, text me now.
  # Set to false if you run her on a machine with no desktop session.
  enabled: true

# Your class schedule. Fill in timetable.yaml, then set this to true.
timetable:
  enabled: false
  file: timetable.yaml

# Semester breaks, study weeks, exam weeks and public holidays.
# Fill in calendar.yaml, then set this to true.
calendar:
  enabled: true
  file: calendar.yaml

log:
  level: INFO
  file: data/nora.log
